[widget]
id = "com.aether.hardware_pro"
name = "Hardware Pro Sensor Matrix"
version = "1.0.0"
author = "Aether Desktop Core Team"
description = "Professional hardware sensor dashboard displaying dedicated GPU VRAM, P/E-core loads, spline graphs, and thermal throttling alerts."

[display]
width = 420
height = 240
opacity = 0.95
locked = false
refresh_rate_hz = 60

[bindings]
gpu_telemetry = "sys.gpu.telemetry"
cpu_topology = "sys.cpu.topology"
memory = "sys.memory.used"
