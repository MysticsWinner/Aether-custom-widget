[package]
name = "dashboard_tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Aether live performance dashboard — ratatui TUI connecting to the core engine via Named Pipe IPC"

[[bin]]
name = "aether-dashboard"
path = "src/main.rs"

[dependencies]
ipc_protocol    = { path = "../ipc_protocol" }
tokio           = { workspace = true }
anyhow          = { workspace = true }
tracing         = { workspace = true }
tracing-subscriber = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }

# TUI dependencies (not in workspace — dashboard-only)
ratatui    = "0.28"
crossterm  = "0.28"
